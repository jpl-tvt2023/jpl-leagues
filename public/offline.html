<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <title>Offline · JPL</title>
    <!--
      Served by public/sw.js when a page navigation fails for lack of network. Self-contained on
      purpose: it must not depend on /_next/static chunks, which belong to whichever deploy was live
      when the worker was installed.
    -->
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        background: linear-gradient(to bottom, #0f172a, #581c87, #0f172a);
        color: #e5e7eb;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        text-align: center;
      }
      main {
        max-width: 22rem;
      }
      img {
        width: 96px;
        height: 96px;
      }
      h1 {
        margin: 20px 0 8px;
        font-size: 1.375rem;
        color: #fff;
      }
      p {
        margin: 0 0 28px;
        font-size: 0.9375rem;
        line-height: 1.5;
        color: #9ca3af;
      }
      button {
        min-height: 48px;
        padding: 0 28px;
        border: 0;
        border-radius: 999px;
        background: linear-gradient(to right, #facc15, #f97316);
        color: #0f172a;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      button:active {
        filter: brightness(0.92);
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>JPL needs a connection for live scores and league data. Check your signal and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      // Come back by itself as soon as the connection does.
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
